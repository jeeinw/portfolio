<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>이직 준비 작업대</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --surface-2:#EFF1F5; --line:#E1E5EB; --line-2:#CDD3DC;
  --text:#0E1A2B; --muted:#566173; --faint:#8A93A3;
  --blue:#1F4FD8; --blue-ink:#1A43B8; --blue-soft:#E8EEFC;
  --red:#D23A3A; --red-soft:#FCEBEB;
  --yellow:#C98F00; --yellow-bright:#F2B705; --yellow-soft:#FDF4D8;
  --green:#1D8A57; --green-soft:#E3F3EA;
  --navy:#0B1B33; --side-text:rgba(255,255,255,.62);
  --sd:0 1px 2px rgba(14,26,43,.05),0 4px 14px rgba(14,26,43,.06);
  --r:12px; --r-sm:8px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1117; --surface:#151A22; --surface-2:#1B222D; --line:#273040; --line-2:#344055;
    --text:#E6EAF0; --muted:#A4AEBE; --faint:#6F7A8C;
    --blue:#7393FF; --blue-ink:#9AB0FF; --blue-soft:rgba(115,147,255,.14);
    --red:#FF7070; --red-soft:rgba(255,112,112,.13);
    --yellow:#F5C451; --yellow-bright:#F5C451; --yellow-soft:rgba(245,196,81,.13);
    --green:#4CC38A; --green-soft:rgba(76,195,138,.13);
    --navy:#080C12; --sd:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1117; --surface:#151A22; --surface-2:#1B222D; --line:#273040; --line-2:#344055;
  --text:#E6EAF0; --muted:#A4AEBE; --faint:#6F7A8C;
  --blue:#7393FF; --blue-ink:#9AB0FF; --blue-soft:rgba(115,147,255,.14);
  --red:#FF7070; --red-soft:rgba(255,112,112,.13);
  --yellow:#F5C451; --yellow-bright:#F5C451; --yellow-soft:rgba(245,196,81,.13);
  --green:#4CC38A; --green-soft:rgba(76,195,138,.13);
  --navy:#080C12; --sd:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}

/* layout */
.app{display:flex;min-height:100vh}
.side{width:232px;flex-shrink:0;background:var(--navy);color:#fff;padding:22px 14px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:0 8px 18px}
.brand-mark{display:flex;gap:4px;margin-bottom:10px}
.brand-mark i{width:10px;height:10px;border-radius:2px;display:block}
.brand-mark i:nth-child(1){background:#2F5BEA}.brand-mark i:nth-child(2){background:#E04848}.brand-mark i:nth-child(3){background:#F2B705}
.brand-title{font-size:15px;font-weight:700;letter-spacing:-.01em}
.brand-sub{font-size:11px;color:var(--side-text);margin-top:2px}
.nav{list-style:none;display:flex;flex-direction:column;gap:2px}
.nav button{width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;color:var(--side-text);font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:10px}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:rgba(47,91,234,.28);color:#fff}
.nav .k{font-size:10px;font-weight:700;width:18px;height:18px;border-radius:5px;display:grid;place-items:center;background:rgba(255,255,255,.08);color:rgba(255,255,255,.7)}
.nav button.on .k{background:#2F5BEA;color:#fff}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:var(--side-text);display:flex;flex-direction:column;gap:6px}
.side-foot select{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:4px 6px;color:#fff;font-size:11px}
.side-foot select option{color:#000}
.save-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4CC38A;margin-right:6px;vertical-align:1px}
main{flex:1;min-width:0;padding:26px 30px 60px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:22px;font-weight:700;letter-spacing:-.02em}
.page-head p{color:var(--muted);font-size:13px;margin-top:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sd)}
.pad{padding:18px}
.sec-t{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.pri:hover{filter:brightness(1.08);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
input[type=text],input[type=password],input[type=date],input[type=number],input[type=url],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font-size:13.5px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
textarea{resize:vertical;line-height:1.7;min-height:90px}
textarea.big{min-height:280px;font-size:14.5px;line-height:1.85}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 5px}
label.f:first-child{margin-top:0}
.hint{font-size:12px;color:var(--faint)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.blue{background:var(--blue-soft);color:var(--blue-ink);border-color:transparent}
.chip.red{background:var(--red-soft);color:var(--red);border-color:transparent}
.chip.yellow{background:var(--yellow-soft);color:var(--yellow);border-color:transparent}
.chip.green{background:var(--green-soft);color:var(--green);border-color:transparent}
button.chip{cursor:pointer}
.empty{color:var(--faint);font-size:13px;padding:24px;text-align:center}
.muted{color:var(--muted)}
.mono{font-variant-numeric:tabular-nums}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}

/* grids */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi .l{font-size:11.5px;color:var(--muted);font-weight:600}
.kpi .v{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11.5px;color:var(--faint);margin-top:2px}
.kpi.blue{border-top:3px solid var(--blue)}.kpi.red{border-top:3px solid var(--red)}.kpi.yellow{border-top:3px solid var(--yellow-bright)}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.split{display:grid;grid-template-columns:270px minmax(0,1fr);gap:16px;align-items:start}
.split3{display:grid;grid-template-columns:220px minmax(0,1fr) 320px;gap:16px;align-items:start}

/* lists */
.list{display:flex;flex-direction:column;max-height:calc(100vh - 210px);overflow:auto}
.li{text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 14px;cursor:pointer;display:block;width:100%}
.li:last-child{border-bottom:0}
.li:hover{background:var(--surface-2)}
.li.on{background:var(--blue-soft)}
.li .t{font-size:13.5px;font-weight:600;line-height:1.4}
.li .m{font-size:11.5px;color:var(--faint);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.list-head{padding:12px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}

/* todo/quick */
.todo{display:flex;flex-direction:column;gap:8px}
.todo button{display:flex;gap:12px;align-items:center;text-align:left;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;width:100%}
.todo button:hover{border-color:var(--blue)}
.todo .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:12px;flex-shrink:0}
.todo .tt{font-size:13px;font-weight:600}
.todo .ts{font-size:12px;color:var(--faint)}

/* heatmap */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:11px;height:11px;border-radius:2px;background:var(--surface-2);display:block}
.heat i.l1{background:color-mix(in srgb,var(--blue) 25%,var(--surface-2))}
.heat i.l2{background:color-mix(in srgb,var(--blue) 50%,var(--surface-2))}
.heat i.l3{background:color-mix(in srgb,var(--blue) 75%,var(--surface-2))}
.heat i.l4{background:var(--blue)}
.heat i.today{outline:1.5px solid var(--yellow-bright);outline-offset:1px}

/* checker */
.chk-sec{margin-bottom:14px}
.chk-sec:last-child{margin-bottom:0}
.chk-t{font-size:12px;font-weight:700;margin-bottom:6px;display:flex;gap:6px;align-items:center}
.chk-item{font-size:12.5px;padding:6px 9px;border-radius:7px;margin-bottom:4px;line-height:1.5}
.chk-item.red{background:var(--red-soft);color:var(--red)}
.chk-item.yellow{background:var(--yellow-soft);color:var(--yellow)}
.ok-line{font-size:12.5px;color:var(--green)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.stat{background:var(--surface-2);border-radius:8px;padding:7px 10px}
.stat .l{font-size:11px;color:var(--faint)}
.stat .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .v.over{color:var(--red)}
.meter{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex;margin:6px 0 4px}
.meter b{display:block;height:100%}
.meter b.m{background:var(--blue)}.meter b.i{background:var(--red)}
.hl{white-space:pre-wrap;word-break:break-word;font-size:14px;line-height:1.85;background:var(--surface-2);border-radius:8px;padding:12px 14px;max-height:340px;overflow:auto}
mark{background:none;color:inherit;border-radius:3px;padding:0 1px}
mark.h{background:var(--red-soft);color:var(--red);font-weight:600;text-decoration:underline wavy var(--red) 1px;text-underline-offset:3px}
mark.s{background:var(--yellow-soft);color:var(--yellow);font-weight:600}
mark.n{border-bottom:2px dotted #E07A12}
mark.ok{border-bottom:2px solid var(--green)}
.diff{white-space:pre-wrap;word-break:break-word;font-size:13.5px;line-height:1.85;background:var(--surface-2);border-radius:8px;padding:12px 14px;max-height:380px;overflow:auto}
.diff del{background:var(--red-soft);color:var(--red);text-decoration:line-through}
.diff ins{background:var(--green-soft);color:var(--green);text-decoration:none}
.ver{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:12.5px}
.ver .vh{display:flex;justify-content:space-between;gap:6px;align-items:center}
.ver .vn{color:var(--muted);margin-top:2px}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;padding:9px 12px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--sd)}

/* kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--surface-2);border-radius:var(--r);padding:10px;min-height:200px}
.col.over{outline:2px dashed var(--blue);outline-offset:-2px}
.col-h{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;padding:2px 4px 10px}
.col-h .n{font-size:11px;color:var(--faint);font-weight:600}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;box-shadow:var(--sd)}
.kc:hover{border-color:var(--blue)}
.kc .co{font-weight:700;font-size:13.5px}
.kc .ro{font-size:12px;color:var(--muted);margin-top:1px}
.kc .ft{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px;align-items:center}
.dl-soon{color:var(--red)!important;font-weight:700}

/* timer */
.timer{font-size:44px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:10px 0}
.bar b{display:block;height:100%;background:var(--blue);transition:width .2s linear}
.bar b.over{background:var(--red)}
.q-big{font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.45}
.score{display:inline-flex;gap:4px}
.score button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:700}
.score button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.checks label{display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 0;cursor:pointer}

/* modal & toast */
.modal{position:fixed;inset:0;background:rgba(8,12,20,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal[hidden]{display:none}
.modal-box{background:var(--surface);border-radius:14px;width:min(860px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:16px}
.modal-b{padding:18px 20px 22px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw}
#toast.on{opacity:1}
.ai-out{white-space:pre-wrap;font-size:13.5px;line-height:1.8}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line-2);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11.5px;color:var(--faint);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.kw{display:flex;flex-wrap:wrap;gap:5px}
.mobile-only{display:none}

@media (max-width:1180px){
  .split3{grid-template-columns:230px minmax(0,1fr)}
  .split3 > .side-panel{grid-column:1 / -1}
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:820px){
  .app{flex-direction:column}
  .side{width:100%;height:auto;position:sticky;top:0;z-index:20;flex-direction:row;align-items:center;padding:10px 12px;gap:10px}
  .brand{padding:0}
  .brand-sub,.brand-mark,.side-foot{display:none}
  .brand-title{font-size:13px;white-space:nowrap}
  .nav{flex-direction:row;overflow-x:auto;gap:2px;flex:1}
  .nav button{padding:6px 9px;font-size:12.5px;white-space:nowrap}
  .nav .k{display:none}
  main{padding:18px 16px 60px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g2,.g3,.split,.split3{grid-template-columns:minmax(0,1fr)}
  .list{max-height:260px}
  .mobile-only{display:block}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark"><i></i><i></i><i></i></div>
      <div class="brand-title">이직 준비 작업대</div>
      <div class="brand-sub" id="brandSub"></div>
    </div>
    <ul class="nav" id="nav"></ul>
    <div class="side-foot">
      <div><span class="save-dot"></span><span id="saveState">로컬 저장</span></div>
      <div class="hint" style="color:var(--side-text)" id="syncState"></div>
      <label class="row" style="gap:6px">테마
        <select id="themeSel"><option value="auto">시스템</option><option value="light">라이트</option><option value="dark">다크</option></select>
      </label>
    </div>
  </aside>
  <main id="view"></main>
</div>
<div id="modal" class="modal" hidden></div>
<div id="toast"></div>

<script>
'use strict';
/* =========================================================
   Storage & seed
   ========================================================= */
const KEY = 'jw-workbench-v1';
const UIKEY = 'jw-workbench-ui';
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const now = () => new Date().toISOString();
const ymd = d => { const x = d || new Date(); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
const today = () => ymd();

const STAGES = ['관심', '준비중', '지원완료', '서류합격', '면접', '최종합격', '종료'];
const TRACKS = ['MBB/컨설팅', 'IB/PE/대체투자', 'Corp Dev/전략', 'FP&A/재무'];
const ORGS = ['NHN', 'AIA생명', '롯데이노베이트', 'CFA', '기타'];
const DKINDS = ['자기소개', '경력기술서', '이력서 문장', '지원동기', '커버레터', '면접 답변', '포지셔닝 문장', '영문'];
const TONES = ['공통', 'MBB', 'IB/PE'];
const LOGCATS = ['경험 정리', '첨삭', '면접 연습', '지원서', '포트폴리오', 'CFA', '네트워킹'];

/* ---- 개인 데이터는 소스에 넣지 않는다: JSON 가져오기 또는 구글시트 불러오기로 채움 ---- */
const mkQ = r => ({ id: uid(), cat: r[0], q: r[1], draft: r[2] || '', basis: r[3] || '', trap: r[4] || '', attempts: [] });
const CFA_PLAY = [
  { k: 'pre1', when: '10/17~10/19', sc: 'pre', t: '이력서 파일 2종 저장 (합격 표기 / 응시 표기)' },
  { k: 'pre2', when: '10/17~10/19', sc: 'pre', t: '리멤버·링크드인 CFA 문구 2종 준비' },
  { k: 'pre3', when: '10/17~10/19', sc: 'pre', t: '헤드헌터 업데이트 메시지 2종 확인' },

function diffHTML(a, b) {
  const A = (a || '').split(/(\s+)/).filter(x => x !== ''), B = (b || '').split(/(\s+)/).filter(x => x !== '');
  const n = A.length, m = B.length;
  if (n * m > 6e6) return `<del>${esc(a)}</del><ins>${esc(b)}</ins>`;
  const dp = new Uint16Array((n + 1) * (m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i * (m + 1) + j] = A[i] === B[j] ? dp[(i + 1) * (m + 1) + j + 1] + 1 : Math.max(dp[(i + 1) * (m + 1) + j], dp[i * (m + 1) + j + 1]);
  let i = 0, j = 0, out = '';
  while (i < n && j < m) {
    if (A[i] === B[j]) { out += esc(A[i]); i++; j++; }
    else if (dp[(i + 1) * (m + 1) + j] >= dp[i * (m + 1) + j + 1]) { out += `<del>${esc(A[i])}</del>`; i++; }
    else { out += `<ins>${esc(B[j])}</ins>`; j++; }
  }
  while (i < n) out += `<del>${esc(A[i++])}</del>`;
  while (j < m) out += `<ins>${esc(B[j++])}</ins>`;
  return out.replace(/<\/del><del>/g, '').replace(/<\/ins><ins>/g, '');
}

  }).filter(x => x.hits.length).sort((a, b) => b.hits.length - a.hits.length);
}

async function callClaude(userMsg) {
  const key = S.settings.apiKey;
  if (!key) throw new Error('설정 탭에서 Anthropic API 키를 먼저 입력해 주세요.');
  const model = S.settings.model || 'claude-opus-5-5';
  const body = { model, max_tokens: 16000, system: sysPrompt(), messages: [{ role: 'user', content: userMsg }] };
  const headers = { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' };
  const fallbackOK = model === 'claude-opus-5-5' || model === 'claude-sonnet-5-5';
  if (model !== 'claude-haiku-4-5') body.output_config = { effort: 'medium' };
  const send = async withFallback => {
    const h = Object.assign({}, headers), b = Object.assign({}, body);
    if (withFallback) { h['anthropic-beta'] = 'server-side-fallback-2026-07-01'; b.fallbacks = 'default'; }
    return fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: h, body: JSON.stringify(b) });
  };
  let res = await send(fallbackOK);
  if (res.status === 400 && fallbackOK) res = await send(false);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error((data.error && data.error.message) || ('HTTP ' + res.status));
  if (data.stop_reason === 'refusal') throw new Error('모델이 이 요청을 처리하지 않았습니다. 문장을 조정해 다시 시도해 주세요.');
  const text = (data.content || []).filter(c => c.type === 'text').map(c => c.text).join('\n').trim();
  if (data.stop_reason === 'max_tokens') return text + '\n\n(출력이 길이 제한에서 잘렸습니다)';
  return text;
}
function parseAI(out) {
  const i = out.indexOf('[변경 포인트]');
  const body = (i >= 0 ? out.slice(0, i) : out).replace(/^\s*\[수정본\]\s*/, '').trim();
  const notes = i >= 0 ? out.slice(i + 7).trim() : '';
  return { body, notes };
}

function streak() {
  const active = d => (S.activity[d] || 0) > 0 || S.log.some(l => l.date === d);
  let n = 0; const d = new Date();
  if (!active(ymd(d))) d.setDate(d.getDate() - 1);
  while (active(ymd(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function heatmap(weeks) {
  const end = new Date(); const start = new Date(); start.setDate(end.getDate() - (weeks * 7 - 1) - end.getDay());
  const logMin = {}; S.log.forEach(l => { logMin[l.date] = (logMin[l.date] || 0) + (+l.minutes || 0); });
  let cells = '';
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    const k = ymd(d); const v = (S.activity[k] || 0) + Math.round((logMin[k] || 0) / 15);
    const lv = v === 0 ? '' : v < 3 ? 'l1' : v < 8 ? 'l2' : v < 16 ? 'l3' : 'l4';
    cells += `<i class="${lv} ${k === today() ? 'today' : ''}" title="${k} · ${v}"></i>`;
  }
  return `<div class="heat">${cells}</div>`;
}

    for (const [k, v] of Object.entries(o)) { const nk = String(k).toLowerCase().replace(/\s|\*/g, ''); if (keys.some(x => nk === x.toLowerCase().replace(/\s/g, ''))) found.push(String(v || '').trim()); }
    return found.filter(Boolean).join(' / ');
  };
  return rows.map(({ cells }) => {
    const r = {}; for (const f in BULK_COLS) r[f] = pick(cells, BULK_COLS[f]);
    r.track = normTrack(r.track + ' ' + r.role); r.stage = normStage(r.stage); r.deadline = normDate(r.deadline);
    r.url = (r.url.match(/https?:\/\/\S+/) || [''])[0];

  }).filter(r => r.company);
}
function normTrack(s) {
  if (/mbb|컨설/i.test(s)) return 'MBB/컨설팅';
  if (/fp&a|재무기획|finance manager/i.test(s)) return 'FP&A/재무';
  if (/ib|pe\b|대체|심사|운용|투자평가|vc|인프라/i.test(s)) return 'IB/PE/대체투자';
  return 'Corp Dev/전략';
}
function normStage(s) {
  if (!s) return '준비중';
  if (STAGES.includes(s)) return s;
  if (/불합|탈락|보류|종료|드랍|포기/.test(s)) return '종료';
  if (/최종|합격(?!.*서류)/.test(s) && !/서류/.test(s)) return /면접/.test(s) ? '면접' : '최종합격';
  if (/면접/.test(s)) return '면접';
  if (/서류.*합격|서류통과/.test(s)) return '서류합격';
  if (/지원|제출|접수/.test(s) && !/미지원|예정/.test(s)) return '지원완료';
  if (/관심|검토|미검토/.test(s)) return '관심';
  return '준비중';
}
function normDate(s) {
  const m = (s || '').match(/(\d{4})[.\-/년\s]*(\d{1,2})[.\-/월\s]*(\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
  const n = (s || '').match(/(\d{1,2})[./](\d{1,2})/);
  return n ? `${new Date().getFullYear()}-${n[1].padStart(2, '0')}-${n[2].padStart(2, '0')}` : '';
}

function cfaPhase() {
  const d = daysUntil(S.settings.cfaResult);
  if (d == null) return { k: 'none', label: '-' };
  if (d > 3) return { k: 'wait', label: '사전 준비 전' };
  if (d > 0) return { k: 'pre', label: '사전 준비 기간' };
  if (d === 0) return { k: 'day', label: '발표 당일' };
  if (d >= -7) return { k: 'after', label: '발표 후 1주' };
  return { k: 'done', label: '플레이북 종료' };
}

/* =========================================================
   Google Sheets sync (Apps Script web app)
   ========================================================= */
const GAS_CODE = `// 이직 준비 작업대 · 구글시트 동기화 (Apps Script)
// 1) TOKEN을 아무 문자열로 바꾸고, 작업대 설정의 '동기화 토큰'에도 같은 값을 입력
const TOKEN = 'CHANGE-ME';

function doGet() { return ContentService.createTextOutput('workbench sync ok'); }

function doPost(e) {
  let res;
  try {
    const body = JSON.parse(e.postData.contents);
    if (body.token !== TOKEN) throw new Error('토큰 불일치');
    const ss = SpreadsheetApp.getActiveSpreadsheet();
    if (body.action === 'push') { saveRaw_(ss, body.data); writeTables_(ss, body.data); res = { ok: true, at: new Date().toISOString() }; }
    else if (body.action === 'pull') { res = { ok: true, data: loadRaw_(ss) }; }
    else if (body.action === 'ping') { const sh = ss.getSheetByName('_raw'); res = { ok: true, at: sh ? sh.getRange(1, 2).getValue() : null }; }
    else throw new Error('unknown action');
  } catch (err) { res = { ok: false, error: String(err && err.message || err) }; }
  return ContentService.createTextOutput(JSON.stringify(res)).setMimeType(ContentService.MimeType.JSON);
}

function sheet_(ss, name) { return ss.getSheetByName(name) || ss.insertSheet(name); }
function cell_(v) { v = v == null ? '' : String(v); if (v.length > 45000) v = v.slice(0, 45000) + '…'; return /^[=+\\-@]/.test(v) ? "'" + v : v; }

function saveRaw_(ss, data) {
  const sh = sheet_(ss, '_raw'); sh.clear();
  const s = JSON.stringify(data), rows = [];
  for (let i = 0; i < s.length; i += 40000) rows.push([s.substr(i, 40000)]);
  sh.getRange(1, 1, rows.length, 1).setValues(rows);
  sh.getRange(1, 2).setValue(new Date().toISOString());
}
function loadRaw_(ss) {
  const sh = ss.getSheetByName('_raw'); if (!sh || sh.getLastRow() < 1) return null;
  return JSON.parse(sh.getRange(1, 1, sh.getLastRow(), 1).getValues().map(r => r[0]).join(''));
}
function table_(ss, name, header, rows) {
  const sh = sheet_(ss, name); sh.clearContents();
  const all = [header].concat(rows.map(r => r.map(cell_)));
  sh.getRange(1, 1, all.length, header.length).setValues(all);
  sh.setFrozenRows(1); sh.getRange(1, 1, 1, header.length).setFontWeight('bold');
}
function writeTables_(ss, d) {
  table_(ss, '지원', ['회사', '포지션', '트랙', '단계', '마감', '서브도메인', '메모'], (d.apps || []).map(a => [a.company, a.role, a.track, a.stage, a.deadline, a.subdomain, a.notes]));
  const iv = []; (d.interviews || []).forEach(x => (x.questions.length ? x.questions : [{}]).forEach(q => iv.push([x.company, x.round, x.date, x.status, q.q, q.answer, q.issue, q.better, x.review, x.next])));
  table_(ss, '면접복기', ['회사', '라운드', '날짜', '상태', '질문', '내 답변', '아쉬운 점', '보완 답변', '총평', '다음 액션'], iv);
  table_(ss, '질문은행', ['분류', '질문', '답변 초안', '근거', '함정', '시도', '최고점'], (d.qa || []).map(q => [q.cat, q.q, q.draft, q.basis, q.trap, q.attempts.length, q.attempts.reduce((m, a) => Math.max(m, a.score || 0), 0)]));
  table_(ss, '경험', ['제목', '조직', '기간', '태그', '상황', '접근', '결과', '역할 범위', '검증'], (d.experiences || []).map(e => [e.title, e.org, e.period, e.tags.join(', '), e.situation, e.action, e.result, e.role, e.verified ? 'O' : '']));
  table_(ss, '드래프트', ['제목', '종류', '톤', '최신 본문', '버전 수', '수정'], (d.drafts || []).map(x => [x.title, x.kind, x.tone, x.text, x.versions.length, x.updated]));
  table_(ss, '연습기록', ['날짜', '분', '분류', '메모'], (d.log || []).map(l => [l.date, l.minutes, l.cat, l.memo]));

function importFile(file) {

      const hasData = S.experiences.length || S.drafts.length || S.interviews.length;
      if (hasData && !confirm('현재 데이터를 가져온 파일로 바꿉니다. 계속할까요?')) return;
      const keep = { apiKey: S.settings.apiKey, sheetUrl: S.settings.sheetUrl, sheetToken: S.settings.sheetToken, sheetAuto: S.settings.sheetAuto };
      localStorage.setItem(KEY, JSON.stringify(d)); S = load();
      for (const k in keep) if (keep[k]) S.settings[k] = keep[k];
      persist(); render(); toast('가져오기 완료');

  newDraft: () => { const d = { id: uid(), title: '새 드래프트', kind: '자기소개', tone: '공통', appId: '', limit: 0, text: '', versions: [], created: now(), updated: now() }; S.drafts.unshift(d); U.draftId = d.id; touch(); save(0); render(); const t = $('#draftText'); if (t) t.focus(); },
  newDraftFor: el => { const a = byId(S.apps, el.dataset.id); const tone = a.track === 'MBB/컨설팅' ? 'MBB' : a.track === 'IB/PE/대체투자' ? 'IB/PE' : '공통'; const d = { id: uid(), title: a.company + ' 지원동기', kind: '지원동기', tone, appId: a.id, limit: 0, text: '', versions: [], created: now(), updated: now() }; S.drafts.unshift(d); U.draftId = d.id; save(0); closeModalSilently(); go('draft'); },
  dupDraft: () => { const d = byId(S.drafts, U.draftId); const c = Object.assign({}, d, { id: uid(), title: d.title + ' (복제)', versions: [], created: now(), updated: now() }); S.drafts.unshift(c); U.draftId = c.id; save(0); render(); },
  delDraft: () => { if (!confirm('이 드래프트와 모든 버전을 삭제할까요?')) return; S.drafts = S.drafts.filter(x => x.id !== U.draftId); U.draftId = null; save(0); render(); },
  snapDraft: () => { const d = byId(S.drafts, U.draftId); const last = d.versions[d.versions.length - 1]; if (last && last.text === d.text) { toast('직전 버전과 같습니다'); return; } d.versions.push({ ts: now(), text: d.text, note: ($('#verNote') || {}).value || '' }); touch(2); save(0); render(); toast('버전 저장'); },
  copyDraft: () => copy(byId(S.drafts, U.draftId).text),
  copyVer: el => copy(byId(S.drafts, U.draftId).versions.find(v => v.ts === el.dataset.ts).text),
  diffDraft: el => { const d = byId(S.drafts, U.draftId); const v = d.versions.find(x => x.ts === el.dataset.ts); $('#cmpBox').innerHTML = `<label class="f row" style="justify-content:space-between">${fmtDT(v.ts)} 버전 → 현재 <button class="btn sm ghost" data-act="clearCmp">닫기</button></label><div class="diff">${diffHTML(v.text, d.text)}</div>`; $('#cmpBox').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); },
  clearCmp: () => { $('#cmpBox').innerHTML = ''; },
  restoreDraft: el => { const d = byId(S.drafts, U.draftId); const v = d.versions.find(x => x.ts === el.dataset.ts); if (!confirm('이 버전으로 되돌릴까요? 현재 내용은 버전으로 먼저 저장됩니다.')) return; if (!d.versions.length || d.versions[d.versions.length - 1].text !== d.text) d.versions.push({ ts: now(), text: d.text, note: '복원 전 자동 저장' }); d.text = v.text; d.updated = now(); save(0); render(); },
  tpl: el => { const t = $('#draftText'); const ins = TEMPLATES[el.dataset.k]; const p = t.selectionStart || t.value.length; t.value = t.value.slice(0, p) + ins + t.value.slice(p); t.dispatchEvent(new Event('input', { bubbles: true })); t.focus(); },
  runAI: async el => {
    const d = byId(S.drafts, U.draftId); if (!d.text.trim()) { toast('본문이 비어 있습니다'); return; }
    const mode = $('#aiMode').value, extra = $('#aiExtra').value.trim();
    const a = byId(S.apps, d.appId);
    if (mode === 'jd' && !(a && a.jd)) { toast('지원처를 연결하고 JD를 붙여넣어 주세요'); return; }
    const msg = `[요청] ${AI_MODES[mode].ask}${extra ? '\n[추가 요청] ' + extra : ''}\n[종류] ${d.kind}\n[톤] ${d.tone}${d.limit ? '\n[글자수 제한] 공백 포함 ' + d.limit + '자' : ''}${a ? `\n[지원처] ${a.company} / ${a.role || ''} / 트랙: ${a.track}` : ''}${a && a.jd && (mode === 'jd' || mode === 'mbb' || mode === 'ib') ? '\n[JD]\n' + a.jd : ''}\n\n[원문]\n${d.text}`;
    const out = $('#aiOut'); el.disabled = true; out.innerHTML = `<div style="margin-top:12px" class="hint"><span class="spin"></span> 첨삭 중…</div>`;
    try {
      const res = await callClaude(msg); const p = parseAI(res);
      ACT._ai = { draftId: d.id, body: p.body, mode };
      const r = check(p.body);
      out.innerHTML = `<hr class="sep"><div class="sec-t">수정본 <span class="row" style="gap:4px">${r.hard.length ? `<span class="chip red">위반 ${r.hard.length}</span>` : '<span class="chip green">위반 0</span>'}<span class="chip">${p.body.length}자</span></span></div>
        <div class="diff" style="max-height:300px">${diffHTML(d.text, p.body)}</div>
        ${p.notes ? `<div class="sec-t" style="margin-top:10px">변경 포인트</div><div class="ai-out" style="font-size:12.5px">${esc(p.notes)}</div>` : ''}
        <div class="row" style="margin-top:10px"><button class="btn pri sm" data-act="applyAI">새 버전으로 적용</button><button class="btn sm" data-act="copyAI">수정본 복사</button></div>`;
      touch(1); save();
    } catch (err) { out.innerHTML = `<div class="chk-item red" style="margin-top:10px">${esc(err.message)}</div>`; }
    el.disabled = false;
  },
  applyAI: () => { const ai = ACT._ai; const d = byId(S.drafts, ai.draftId); if (!d) return; if (!d.versions.length || d.versions[d.versions.length - 1].text !== d.text) d.versions.push({ ts: now(), text: d.text, note: 'AI 첨삭 전' }); d.text = ai.body; d.versions.push({ ts: now(), text: d.text, note: 'AI · ' + AI_MODES[ai.mode].label }); d.updated = now(); touch(2); save(0); render(); toast('새 버전으로 적용했습니다'); },
  copyAI: () => copy(ACT._ai.body),

  // apps
  appView: el => { U.appView = el.dataset.v; saveUI(); render(); },
  openBulk: () => openBulk(),
  bulkApply: () => bulkApply(),
  copyBulkPrompt: () => copy(BULK_PROMPT),
  newApp: () => { const a = { id: uid(), company: '새 지원처', role: '', track: 'Corp Dev/전략', stage: '관심', deadline: '', url: '', subdomain: '', branch: '', jd: '', notes: '', timeline: [{ ts: now(), text: '추가됨' }], created: now(), updated: now() }; S.apps.push(a); touch(); save(0); render(); openApp(a.id); },
  addTL: el => { const a = byId(S.apps, el.dataset.id); const t = $('#tlText').value.trim(); if (!t) return; a.timeline.push({ ts: now(), text: t }); touch(); save(0); openApp(a.id); },
  delApp: el => { if (!confirm('이 지원처를 삭제할까요? 연결된 드래프트는 남습니다.')) return; S.apps = S.apps.filter(x => x.id !== el.dataset.id); S.drafts.forEach(d => { if (d.appId === el.dataset.id) d.appId = ''; }); save(0); closeModal(); },

  // practice
  ptab: el => { U.practiceTab = el.dataset.t; if (el.dataset.t === 'pitch' && ![30, 60, 90].includes(U.pitchSecs)) U.pitchSecs = 60; if (el.dataset.t === 'qa' && ![60, 90, 120].includes(U.pitchSecs)) U.pitchSecs = 90; saveUI(); render(); },
  qaPick: el => { U.qaId = el.dataset.id; U.practiceTab = 'qa'; if (![60, 90, 120].includes(U.pitchSecs)) U.pitchSecs = 90; saveUI(); if (U.view !== 'practice') go('practice'); else render(); },
  qaNext: () => { const i = S.qa.findIndex(x => x.id === U.qaId); U.qaId = S.qa[(i + 1) % S.qa.length].id; saveUI(); render(); },
  qaPrev: () => { const i = S.qa.findIndex(x => x.id === U.qaId); U.qaId = S.qa[(i - 1 + S.qa.length) % S.qa.length].id; saveUI(); render(); },
  qaRandom: () => { const others = S.qa.filter(x => x.id !== U.qaId); if (!others.length) return; U.qaId = others[Math.floor(Math.random() * others.length)].id; saveUI(); render(); },
  tSecs: el => { U.pitchSecs = +el.dataset.s; saveUI(); document.querySelectorAll('[data-act="tSecs"]').forEach(b => b.classList.toggle('on', b === el)); if (timer.running) tick(); },
  tToggle: el => {
    if (timer.running) { timer.elapsed += (Date.now() - timer.start) / 1000; clearInterval(timer.id); timer.running = false; el.textContent = '계속'; }
    else { timer.start = Date.now(); timer.running = true; timer.id = setInterval(tick, 200); el.textContent = '정지'; }
  },
  tReset: () => resetTimer(),
  qaScore: el => { qaScoreSel = +el.dataset.n; document.querySelectorAll('#qaScore button').forEach(b => b.classList.toggle('on', +b.dataset.n === qaScoreSel)); },
  qaSave: () => {
    const q = byId(S.qa, U.qaId); const text = $('#qaAns').value.trim(); if (!text) { toast('답변을 입력해 주세요'); return; }
    const checks = [...document.querySelectorAll('#qaChecks input')].map(c => c.checked);
    q.attempts.push({ ts: now(), text, secs: curElapsed(), score: qaScoreSel, checks, ai: qaLastAI });
    touch(3); save(0); render(); toast('시도 저장');
  },
  qaLoad: el => { const q = byId(S.qa, U.qaId); const x = q.attempts.find(a => a.ts === el.dataset.ts); const t = $('#qaAns'); t.value = x.text; t.dispatchEvent(new Event('input')); t.focus(); },
  qaAI: async el => {
    const q = byId(S.qa, U.qaId); const text = $('#qaAns').value.trim(); if (!text) { toast('답변을 먼저 써주세요'); return; }
    const out = $('#qaAIout'); el.disabled = true; out.innerHTML = '<div class="hint" style="margin-top:10px"><span class="spin"></span> 피드백 생성 중…</div>';
    try {
      const res = await callClaude(`[요청] 아래는 면접 질문에 대한 내 답변이다. 면접관 관점에서 평가하고 다듬어줘. 수정본은 ${U.pitchSecs}초 안에 말할 수 있는 길이(분당 약 300자)로. 변경 포인트에는 (1) 결론이 먼저 나오는지 (2) 숫자 근거 (3) 역할 범위의 정확성 (4) 과장 리스크 (5) 예상 꼬리질문 2개를 포함해줘.\n[질문] ${q.q}\n\n[원문]\n${text}`);
      const p = parseAI(res); qaLastAI = res;
      out.innerHTML = `<hr class="sep"><div class="sec-t">AI 수정본</div><div class="diff">${diffHTML(text, p.body)}</div>${p.notes ? `<div class="sec-t" style="margin-top:10px">피드백</div><div class="ai-out" style="font-size:12.5px">${esc(p.notes)}</div>` : ''}<div class="row" style="margin-top:8px"><button class="btn sm" data-act="qaUseAI">수정본을 답변칸에 넣기</button></div>`;
      ACT._qaAI = p.body;
    } catch (err) { out.innerHTML = `<div class="chk-item red" style="margin-top:10px">${esc(err.message)}</div>`; }
    el.disabled = false;
  },
  qaUseDraft: () => { const q = byId(S.qa, U.qaId); const t = $('#qaAns'); t.value = q.draft || ''; t.dispatchEvent(new Event('input')); },
  qaUseAI: () => { const t = $('#qaAns'); t.value = ACT._qaAI; t.dispatchEvent(new Event('input')); },
  qaToDraft: () => { const q = byId(S.qa, U.qaId); const text = $('#qaAns').value.trim(); const d = { id: uid(), title: q.q.slice(0, 40), kind: '면접 답변', tone: '공통', appId: '', limit: 0, text, versions: [], created: now(), updated: now() }; S.drafts.unshift(d); U.draftId = d.id; save(0); go('draft'); },
  addQ: () => { const q = $('#newQ').value.trim(); if (!q) return; S.qa.push({ id: uid(), q, cat: $('#newQcat').value.trim() || '기타', attempts: [] }); save(0); render(); },
  delQ: el => { if (!confirm('질문과 시도 기록을 삭제할까요?')) return; S.qa = S.qa.filter(x => x.id !== el.dataset.id); save(0); render(); },
  pitchSave: () => { const text = $('#pitchText').value.trim(); if (!text) { toast('스크립트를 입력해 주세요'); return; } S.pitches.push({ ts: now(), label: $('#pitchLabel').value, text, secs: curElapsed(), target: U.pitchSecs, score: qaScoreSel, memo: $('#pitchMemo').value.trim() }); touch(3); save(0); render(); toast('피치 기록 저장'); },
  pitchToDraft: () => { const text = $('#pitchText').value.trim(); const d = { id: uid(), title: $('#pitchLabel').value + ' 스크립트', kind: '포지셔닝 문장', tone: '공통', appId: '', limit: 0, text, versions: [], created: now(), updated: now() }; S.drafts.unshift(d); U.draftId = d.id; save(0); go('draft'); },

  // cfa
  cfaStatus: el => { S.cfa.status = el.dataset.s; save(0); render(); },
  cfaAddHH: () => { S.cfa.headhunters.push('새 헤드헌터'); save(0); render(); },
  copyTxt: el => copy(el.dataset.t),

  // interviews
  toggleEditP: () => { U.editP = !U.editP; saveUI(); render(); },
  newIv: () => { const iv = { id: uid(), company: '새 면접', round: '1차', role: '', date: today(), format: '', status: '결과 대기', feeling: 0, questions: [{ id: uid(), q: '', answer: '', issue: '', better: '' }], external: '', review: '', lessons: '', next: '', source: '', created: now(), updated: now() }; S.interviews.unshift(iv); U.ivId = iv.id; touch(); save(0); render(); },
  selIv: el => { U.ivId = el.dataset.id; saveUI(); render(); },
  ivFeel: el => { const iv = byId(S.interviews, U.ivId); iv.feeling = +el.dataset.n; save(0); render(); },
  ivAddQ: el => { const iv = byId(S.interviews, el.dataset.id); iv.questions.push({ id: uid(), q: '', answer: '', issue: '', better: '' }); save(0); render(); },
  ivDelQ: el => { if (!confirm('이 질문을 삭제할까요?')) return; const iv = byId(S.interviews, el.dataset.iv); iv.questions = iv.questions.filter(q => q.id !== el.dataset.q); save(0); render(); },
  ivToBank: el => { const iv = byId(S.interviews, el.dataset.iv); const q = byId(iv.questions, el.dataset.q); if (!q.q.trim()) { toast('질문을 먼저 입력해 주세요'); return; } const ex = S.qa.find(x => x.q === q.q); if (ex) { ex.draft = q.better || ex.draft; toast('질문 은행의 같은 질문에 보완 답변을 반영했습니다'); } else { S.qa.push({ id: uid(), cat: iv.company + ' 복기', q: q.q, draft: q.better, basis: '', trap: q.issue, attempts: [] }); toast('질문 은행에 추가했습니다'); } save(0); },
  delIv: el => { if (!confirm('이 복기를 삭제할까요?')) return; S.interviews = S.interviews.filter(x => x.id !== el.dataset.id); U.ivId = null; save(0); render(); },
  ivAI: async el => {
    const iv = byId(S.interviews, el.dataset.id); const out = $('#ivAIout'); el.disabled = true;
    out.innerHTML = '<div class="hint" style="margin-top:10px"><span class="spin"></span> 분석 중…</div>';
    try {
      const qs = iv.questions.map((q, i) => `Q${i + 1}. ${q.q}\n내 답변: ${q.answer}`).join('\n\n');
      const res = await callClaude(`[요청] 면접 복기를 면접관 관점에서 냉정하게 분석해줘. 위로나 칭찬 위주로 쓰지 말고, 질문별 면접관 의도, 실제 약점, 사실 프로필 범위 안에서의 보완 답변을 써줘. 확인 안 된 사실·수치는 [확인 필요]로 표시.\n[회사] ${iv.company} / ${iv.round} / ${iv.role}\n\n[원문]\n${qs}`);
      const p = parseAI(res);
      out.innerHTML = `<hr class="sep"><div class="sec-t">AI 분석</div><div class="ai-out" style="font-size:13px">${esc(p.body)}</div>${p.notes ? `<div class="ai-out hint" style="margin-top:8px">${esc(p.notes)}</div>` : ''}<div class="row" style="margin-top:8px"><button class="btn sm" data-act="copyTxt" data-t="${esc(p.body)}">복사</button></div>`;
    } catch (err) { out.innerHTML = `<div class="chk-item red" style="margin-top:10px">${esc(err.message)}</div>`; }
    el.disabled = false;
  },

  // sheets
  syncPush: () => sheetPush(false),
  syncPull: () => sheetPull(),
  syncTest: async () => { const o = $('#syncOut'); o.innerHTML = '<span class="spin"></span>'; try { const j = await sheetCall('ping'); o.textContent = '연결 성공 · 마지막 시트 저장: ' + (j.at ? fmtDT(j.at) : '없음'); } catch (e) { o.textContent = '실패: ' + e.message; } },
  copyGAS: () => copy(GAS_CODE),

  // log
  addLog: () => { S.log.push({ ts: now(), date: $('#lgDate').value || today(), minutes: +$('#lgMin').value || 0, cat: $('#lgCat').value, memo: $('#lgMemo').value.trim() }); save(0); render(); toast('기록했습니다'); },
  delLog: el => { S.log = S.log.filter(l => l.ts !== el.dataset.ts); save(0); render(); },

  // settings
  exportJSON: () => { const c = JSON.parse(JSON.stringify(S)); c.settings.apiKey = ''; c.settings.sheetToken = ''; download(`workbench-${today()}.json`, JSON.stringify(c, null, 2)); },
  exportMD: () => exportMD(),
  resetAll: () => { if (!confirm('모든 데이터를 초기 상태로 되돌립니다. 먼저 JSON 백업을 권장합니다. 계속할까요?')) return; const key = S.settings.apiKey; S = seed(); S.settings.apiKey = key; persist(); U.expId = U.draftId = U.qaId = null; render(); toast('초기화했습니다'); },
  testAI: async () => { const o = $('#testOut'); o.innerHTML = '<span class="spin"></span>'; try { const r = await callClaude('[요청] 연결 테스트다. 수정본에 "연결됨"만 쓰고 변경 포인트는 "- 없음"으로 답해.\n\n[원문]\n테스트'); o.textContent = '연결 성공 · ' + parseAI(r).body.slice(0, 30); } catch (e) { o.textContent = '실패: ' + e.message; } }
};
function closeModalSilently() { const m = $('#modal'); m.hidden = true; m.innerHTML = ''; }
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'INPUT' && (el.type === 'checkbox')) return; // handled by change
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault(); fn(el, e);
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#modal').hidden) closeModal();
  if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); if (U.view === 'draft' && U.draftId) ACT.snapDraft(); else { persist(); toast('저장했습니다'); } }
});

/* theme */
function applyTheme() {
  const t = S.settings.theme || 'auto';
  if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  $('#themeSel').value = t;
}
$('#themeSel').addEventListener('change', e => { S.settings.theme = e.target.value; applyTheme(); save(0); });
window.addEventListener('beforeunload', () => { if (saveTimer) { clearTimeout(saveTimer); persist(); } });

applyTheme();
render();
setSaveState('저장됨 ' + fmtDT(S.meta.updated));
setSyncState();
</script>
</body>
</html>
